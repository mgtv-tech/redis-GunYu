name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'test'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make allos

      - name: Get the version
        id: get_version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="manual-${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create Zip Archive
        run: |
          zip redisGunYu-${{ steps.get_version.outputs.VERSION }}.darwin-amd64.zip redisGunYu.darwin-amd64
          zip redisGunYu-${{ steps.get_version.outputs.VERSION }}.darwin-arm64.zip redisGunYu.darwin-arm64
          zip redisGunYu-${{ steps.get_version.outputs.VERSION }}.win-amd64.zip redisGunYu.win-amd64
          zip redisGunYu-${{ steps.get_version.outputs.VERSION }}.linux-amd64.zip redisGunYu.linux-amd64

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: redisGunYu-${{ steps.get_version.outputs.VERSION }}.*.zip

      - name: Upload manual-build artifacts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: redisGunYu-${{ steps.get_version.outputs.VERSION }}
          path: redisGunYu-${{ steps.get_version.outputs.VERSION }}.*.zip
          if-no-files-found: error
