name: goci

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: goci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-redis:
    name: Build Redis ${{ matrix.redis }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        redis: ["7.4.1", "8.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .tools/redis/${{ matrix.redis }}
          key: redis-source-${{ runner.os }}-${{ matrix.redis }}-v1
      - name: Install build dependencies
        if: ${{ hashFiles(format('.tools/redis/{0}/bin/redis-server', matrix.redis)) == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config
      - name: Build pinned Redis
        if: ${{ hashFiles(format('.tools/redis/{0}/bin/redis-server', matrix.redis)) == '' }}
        env:
          REDIS_VERSION: ${{ matrix.redis }}
        run: bash ./tests/integration/install_redis_source.sh "${REDIS_VERSION}" ".tools/redis/${REDIS_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: redis-${{ matrix.redis }}
          path: .tools/redis/${{ matrix.redis }}
          if-no-files-found: error

  static-build:
    name: Static build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Static checks and build
        run: make test-static

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: make test-coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: .artifacts/tests/unit
          if-no-files-found: error

  race-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests
        run: make test-race

  integration-redis:
    name: Integration Redis ${{ matrix.redis }}
    needs: build-redis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        redis: ["7.4.1", "8.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: redis-${{ matrix.redis }}
          path: .tools/redis/${{ matrix.redis }}
      - name: Real Redis integration
        env:
          REDIS_SERVER_BIN: ${{ github.workspace }}/.tools/redis/${{ matrix.redis }}/bin/redis-server
        run: |
          chmod +x ".tools/redis/${{ matrix.redis }}/bin/"*
          export PATH="${{ github.workspace }}/.tools/redis/${{ matrix.redis }}/bin:${PATH}"
          make test-integration
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-integration-${{ matrix.redis }}
          path: .artifacts/tests/integration
          if-no-files-found: error

  e2e-smoke-nonbisync:
    needs: build-redis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: redis-7.4.1
          path: .tools/redis/7.4.1
      - name: Non-bisync E2E smoke
        env:
          SMOKE_CASES: nonbisync
          REDIS_SERVER_BIN: ${{ github.workspace }}/.tools/redis/7.4.1/bin/redis-server
        run: |
          chmod +x .tools/redis/7.4.1/bin/*
          export PATH="${{ github.workspace }}/.tools/redis/7.4.1/bin:${PATH}"
          make test-e2e-smoke
      - name: Upload non-bisync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-nonbisync
          path: .artifacts/tests/e2e-smoke
          if-no-files-found: error

  e2e-smoke-bisync:
    needs: build-redis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: redis-7.4.1
          path: .tools/redis/7.4.1
      - name: Bisync E2E smoke
        env:
          SMOKE_CASES: bisync
          REDIS_SERVER_BIN: ${{ github.workspace }}/.tools/redis/7.4.1/bin/redis-server
        run: |
          chmod +x .tools/redis/7.4.1/bin/*
          export PATH="${{ github.workspace }}/.tools/redis/7.4.1/bin:${PATH}"
          make test-e2e-smoke
      - name: Upload bisync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-bisync
          path: .artifacts/tests/e2e-smoke
          if-no-files-found: error
